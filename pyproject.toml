[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contractforge"
version = "0.1.0"
description = "A local-first AI data engineering portfolio project"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["contractforge*"]

[tool.setuptools.package-data]
contractforge = ["web/*", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
